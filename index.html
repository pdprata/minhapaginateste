<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #222;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            position: relative;
            width: 4808px;
            height: 3100px;
            transform-origin: center center;
        }

        .imagem {
            position: absolute;
            left: 0;
            top: 0;
            width: 4808px;
            height: 3100px;
        }

        .gif {
            position: absolute;
            left: 3819px;
            top: 107px;
            width: 800px;
            height: 1414px;
        }
    </style>
</head>

<body>

<div class="container">

    <img class="imagem" src="imagem.png">
    <img class="gif" src="roleta.gif">

</div>

<script>
function ajustarPagina() {

    const container = document.querySelector('.container');

    const largura = window.innerWidth;
    const altura = window.innerHeight;

    const escala = Math.min(
        largura / 4808,
        altura / 3100
    );

    container.style.transform = `scale(${escala})`;
}

window.addEventListener('resize', ajustarPagina);

ajustarPagina();
</script>

</body>
</html>
