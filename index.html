<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #222;
        }

        .container {
            position: absolute;

            width: 4808px;
            height: 3100px;

            left: 50%;
            top: 50%;

            transform-origin: center center;
        }

        .imagem {
            position: absolute;
            left: 0;
            top: 0;

            width: 4808px;
            height: 3100px;
        }

        .gif {
            position: absolute;

            left: 3819px;
            top: 5px;

            width: 600px;
            height: 1061px;
        }
    </style>
</head>

<body>

<div class="container">

    <img class="imagem" src="imagem2.png">
    <img class="gif" src="roleta.gif">

</div>

<script>
function ajustarPagina() {

    const container = document.querySelector('.container');

    const largura = window.innerWidth;
    const altura = window.innerHeight;

    const escala = Math.min(
        largura / 4808,
        altura / 3100
    );

    container.style.transform =
        `translate(-50%, -50%) scale(${escala})`;
}

window.addEventListener('resize', ajustarPagina);

ajustarPagina();
</script>

</body>
</html>
